[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoninglab"
version = "0.1.0"
description = "Reproducible framework to study LLM reasoning: policy comparison, mechanistic probing, causal ablation."
requires-python = ">=3.11"

# Core runtime dependencies — always required.
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",       # YAML task-file support in tasks/loaders.py
]

# Optional extras — install with: pip install -e ".[model]"  or  pip install -e ".[dev]"
[project.optional-dependencies]
model = [
    # Required to run Qwen inference locally (models/qwen_local.py).
    # torch version is left unpinned — install the CUDA variant manually:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu121
    "transformers>=4.40",
    "accelerate>=0.30",      # device_map="auto" and CPU-offload support
    "bitsandbytes>=0.43",    # 4-bit NF4 quantization (Windows support from 0.42+)
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
