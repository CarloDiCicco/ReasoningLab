# Smoke test for repair_b policy with Qwen3-4B-Instruct-2507.
# Runs 20 tasks with budget=3 to exercise iterative repair logic.
#
# Usage:
#   python -m reasoninglab.cli --config configs/h1/smoke-repair_b.yaml

experiment_id: h1-smoke-repair-b
hypothesis: H1
policy: repair_b
budget_B: 3
seed: 0
model_id: Qwen/Qwen3-4B-Instruct-2507
max_tasks: 20

generation:
  max_new_tokens: 512
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0

runtime:
  verifier_timeout_s: 8.0
  capture_device_map: true

paths:
  tasks_file: data/lcb_leetcode.jsonl
  runs_root: runs
  results_root: results/h1
