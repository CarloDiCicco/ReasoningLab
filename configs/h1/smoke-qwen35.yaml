# Minimal H1 smoke config for Qwen3.5-4B (native thinker, non-thinking mode).
# Mirror of smoke.yaml but with Qwen3.5-specific generation parameters.
#
# Usage:
#   python -m reasoninglab.cli --config configs/h1/smoke-qwen35.yaml

experiment_id: h1-smoke-qwen35
hypothesis: H1
policy: baseline
budget_B: 1
seed: 0
model_id: Qwen/Qwen3.5-4B
max_tasks: 20

generation:
  max_new_tokens: 512        # Qwen3.5 is more verbose, needs more room
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0     # Qwen3.5 card: repetition_penalty=1.0 for non-thinking mode
  presence_penalty: 1.3      # Qwen3.5 card: presence_penalty=1.5 for non-thinking general tasks (custom LogitsProcessor)

runtime:
  verifier_timeout_s: 8.0
  capture_device_map: true

paths:
  tasks_file: data/lcb_leetcode.jsonl
  runs_root: runs
  results_root: results/h1
