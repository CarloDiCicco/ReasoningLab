# H2 eval: probe_guided policy — REMAINING tasks after crash.
# Merge attempts.jsonl with runs/h2-eval-probe_guided_20260322_025501 after completion.

experiment_id: h2-eval-probe_guided-remaining
hypothesis: H2
policy: probe_guided
budget_B: 3
seed: 0
model_id: Qwen/Qwen3-4B-Instruct-2507

probe:
  probe_path: results/h2/probe/probe_layer_35.joblib
  probe_layer: 35
  threshold: 0.2

generation:
  max_new_tokens: 768
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0

runtime:
  verifier_timeout_s: 8.0
  capture_device_map: true
  return_hidden_states: false

paths:
  tasks_file: data/eval_tasks_remaining.jsonl
  runs_root: runs
  results_root: results/h2