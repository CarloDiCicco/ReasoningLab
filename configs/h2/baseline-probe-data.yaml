# H2 probe data collection: baseline on all 388 tasks with hidden states capture.
# Runs baseline (budget=1) and saves per-layer hidden states as .npz files
# for training the H2 linear probe (pass/fail classifier).
#
# Usage:
#   python -m reasoninglab.cli --config configs/h2/baseline-probe-data.yaml
#
# Smoke test (1 task, verify .npz files are saved correctly):
#   python -m reasoninglab.cli --config configs/h2/baseline-probe-data.yaml --max-tasks 1

experiment_id: h2-baseline-probe-data
hypothesis: H2
policy: baseline
budget_B: 1
seed: 0
model_id: Qwen/Qwen3-4B-Instruct-2507

generation:
  max_new_tokens: 768
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0

runtime:
  verifier_timeout_s: 8.0
  capture_device_map: true
  return_hidden_states: true

paths:
  tasks_file: data/all_tasks.jsonl
  runs_root: runs
  results_root: results/h2
