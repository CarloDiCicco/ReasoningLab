# REPLICATION of the h2-trajectory-all run with CORRECTED LiveCodeBench tests.
#
# Why this exists: the original run (runs/h2-trajectory-all/, pass_rate 0.5203)
# graded each task against only its 2-4 PUBLIC test cases. A bug in
# scripts/prepare_livecodebench.py::_parse_test_cases silently dropped every
# task's PRIVATE test cases (they are base64(zlib(pickle(...)))-encoded, and
# json.loads() raised JSONDecodeError which was swallowed as "no tests"). The
# corrected data file data/lcb_all_FIXED.jsonl restores the full public+private
# suites (avg 2.5 -> 28.8 tests/task, verified: same 444 task_ids, byte-
# identical prompts, original asserts a strict subset of corrected).
#
# EVERY generation parameter below is identical to the original run (verified
# against runs/h2-trajectory-all/summary.jsonl):
#   model_id, budget_B, seed, max_new_tokens, do_sample, temperature, top_p,
#   top_k, min_p, repetition_penalty, presence_penalty.
# (verifier_timeout_s is the ONE deliberate exception: raised 8.0s -> 30.0s,
#  see the runtime: block below for the measured reason.)
# The model is loaded with the SAME 4-bit NF4 quantization (models/qwen_local.py
# default) as the original. The ONLY intended difference is the corrected test
# suites (and, unavoidably, the hardware: original was RTX 4050 6GB, this is the
# DGX GB10 — sampling + hardware differences mean generations will not be bit-
# identical, which is expected for a replication and stated in the paper).
#
# The full 444-task set is run in ONE pass here (the original was merged from 4
# sub-runs over 3 task-file splits that together equal these 444 task_ids).

experiment_id: h2-trajectory-repair_b-CORRECTED
hypothesis: H2
policy: repair_b
seed: 0
model_id: Qwen/Qwen3-4B-Instruct-2507
budget_B: 5

generation:
  max_new_tokens: 768
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0

runtime:
  # Raised from the paper's 8.0s to 30.0s: the corrected private test suites
  # inline very large inputs (up to ~37 MB of test code in one task), and
  # Python needs >2s just to COMPILE the test literals on 13/444 tasks (>4s on
  # 4 tasks, measured) BEFORE the candidate solution runs at all. At 8s those
  # tasks were being killed and mislabeled `timeout` regardless of solution
  # quality (timeout rate jumped 0.2% -> 7.3% vs the buggy run). 30s clears the
  # heaviest correct suites while still catching genuine infinite loops (a real
  # hang never terminates, so 8s vs 30s does not change what we catch, only
  # whether slow-but-correct / harness-bound tasks are falsely timed out).
  verifier_timeout_s: 30.0
  capture_device_map: true
  return_hidden_states: true

paths:
  tasks_file: data/lcb_all_FIXED.jsonl
  runs_root: runs
  results_root: results/h2
