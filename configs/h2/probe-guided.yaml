# H2 probe-guided policy: routes between repair and retry based on probe score.
#
# The probe (layer-35 logistic regression) scores the prompt once per task.
# If P(pass) >= threshold → repair strategy (feed error back to model).
# If P(pass) <  threshold → retry strategy (fresh sample from same prompt).
#
# Generation settings match the baseline run for a fair comparison.
# Sampling is enabled (do_sample=true) so fresh retries produce diverse outputs.
#
# Usage:
#   python -m reasoninglab.cli --config configs/h2/probe-guided.yaml
#
# Smoke test (1 task):
#   python -m reasoninglab.cli --config configs/h2/probe-guided.yaml --max-tasks 1

experiment_id: h2-probe-guided
hypothesis: H2
policy: probe_guided
budget_B: 5
seed: 0
model_id: Qwen/Qwen3-4B-Instruct-2507

probe:
  probe_path: results/h2/probe/probe_layer_35.joblib
  probe_layer: 35
  threshold: 0.5

generation:
  max_new_tokens: 768
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0

runtime:
  verifier_timeout_s: 8.0
  capture_device_map: true
  return_hidden_states: false

paths:
  tasks_file: data/all_tasks.jsonl
  runs_root: runs
  results_root: results/h2
